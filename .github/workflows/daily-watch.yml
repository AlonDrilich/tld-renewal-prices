name: daily-watch
on:
  schedule:
    # Three chances a day: GitHub runs scheduled jobs on this repo hours late and may skip one.
    # watch.py writes a row only when a price changed, so extra runs add nothing to the log.
    - cron: "41 6 * * *"
    - cron: "23 13 * * *"
    - cron: "52 20 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/watch.py
      - name: Commit if a price changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/watch
          git diff --cached --quiet && exit 0
          git commit -m "Watch: price change $(date -u +%F)"
          git pull --rebase
          git push
